[package]
name = "rea-ghidra-rust-worker"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
publish = false
autotests = false
autobenches = false

[[bin]]
name = "rea-ghidra-rust-worker"
path = "src/main.rs"
bench = false

[dependencies]
anyhow = "=1.0.104"
ghidra-decompiler = { version = "=2.1.0", default-features = false, features = [
  "x86",
  "arm",
  "aarch64",
] }
object = { version = "=0.37.3", default-features = false, features = [
  "read_core",
  "std",
  "elf",
  "pe",
  "macho",
  "unaligned",
] }
redb = "=3.1.3"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[workspace]
