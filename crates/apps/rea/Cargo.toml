[package]
name = "rea"
description = "REA: reverse engineer anything from your terminal or agent (native runtime)."
# Tracks the npm package version rather than the workspace version.
version = "6.7.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "rea"
path = "src/main.rs"

[features]
# Optional native providers are forwarded explicitly by the package build.
# Keep Frida out of the default build because it links the externally installed
# frida-core devkit selected by REA_FRIDA_DEVKIT_DIR.
frida = ["rea-tools-debug/frida"]

[dependencies]
rea-core.workspace = true
rea-analysis.workspace = true
rea-application.workspace = true
rea-mcp.workspace = true
rea-cli.workspace = true
rea-tools-ledger.workspace = true
rea-tools-artifacts.workspace = true
rea-tools-captures.workspace = true
rea-tools-android.workspace = true
rea-tools-web.workspace = true
rea-tools-managed.workspace = true
rea-tools-application.workspace = true
rea-tools-debug.workspace = true
rea-tools-process.workspace = true
rea-tools-binary.workspace = true
rea-tools-enhanced.workspace = true
rea-provider-hopper.workspace = true
rea-provider-ghidra.workspace = true
rea-provider-ida.workspace = true
rea-provider-kuna.workspace = true
serde_json = { workspace = true, features = ["raw_value", "preserve_order"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_Threading"] }

[lints.rust]
# The private worker uses one documented process-global allocator boundary.
# Keep unsafe code denied elsewhere while allowing that isolated module to opt in.
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
