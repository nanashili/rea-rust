[package]
name = "rea-tools-artifacts"
description = "Static artifact, Apple, PE, Rust, Go, IL2CPP, SQLite, WASM, EVM and Swift tools."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Temporary family gates used only while families are ported in isolation.
default = ["family-static", "family-sqlite", "family-evm", "family-wasm", "family-native", "family-artifacts", "family-desktop", "family-apple"]
family-static = []
family-sqlite = []
family-evm = []
family-wasm = []
family-native = ["native-core", "native-macho", "native-plist", "native-signature"]
native-core = []
native-macho = ["native-core"]
native-plist = ["native-core"]
native-signature = ["native-core"]
family-artifacts = []
family-macos-readers = []
family-desktop = []
family-apple = []

[dependencies]
rea-core.workspace = true
rea-host.workspace = true
rea-application.workspace = true
rea-rust-analysis.workspace = true
rea-analysis.workspace = true
rea-mcp.workspace = true
rea-tools-binary.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["raw_value", "preserve_order"] }
base64.workspace = true
evmole = { workspace = true, features = ["serde"] }
flate2.workspace = true
regex.workspace = true
# Same SQLite binding and bundled engine as rea-rust-analysis.
rusqlite = { workspace = true, features = ["bundled"] }
sha2.workspace = true
tempfile.workspace = true
unicode-normalization.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[lints]
workspace = true
