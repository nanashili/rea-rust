[package]
name = "rea-tools-android"
description = "Android (JADX), Apktool, JEB and ADB device tools."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
rea-core.workspace = true
rea-host.workspace = true
rea-application.workspace = true
rea-rust-analysis.workspace = true
rea-mcp.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["raw_value", "preserve_order"] }
regex.workspace = true
sha2.workspace = true
tempfile.workspace = true
base64.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
] }

[lints.rust]
# `deny` (not `forbid`) so the single Windows private-directory FFI module can
# opt in locally; every other module remains free of unsafe code.
unsafe_code = "deny"
