[package]
name = "rea-cli"
description = "REA's native command-line interface (incur-compatible parsing and output)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
axum = { workspace = true, features = ["json", "http1", "tokio"] }
rea-application.workspace = true
rea-core.workspace = true
rea-host.workspace = true
rea-mcp.workspace = true
rea-tools-binary.workspace = true
futures.workspace = true
rmcp = { workspace = true, features = ["server", "transport-streamable-http-server"] }
serde_json = { workspace = true, features = ["raw_value", "preserve_order"] }
tokio = { workspace = true, features = ["net", "rt", "signal", "sync", "time"] }
tokio-util.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
