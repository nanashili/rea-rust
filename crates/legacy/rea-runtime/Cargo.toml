[package]
name = "rea-runtime"
description = "Superseded experimental native runtime (`rea-native`); kept as a reference until the `rea` cutover completes."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "rea-native"
path = "src/main.rs"

[dependencies]
rea-core.workspace = true
rea-host.workspace = true
rea-application.workspace = true
rea-rust-analysis.workspace = true
base64.workspace = true
serde_json = { workspace = true, features = ["raw_value", "preserve_order"] }
serde = { workspace = true, features = ["derive"] }
bytes.workspace = true
sha2.workspace = true
futures.workspace = true
http-body.workspace = true
rmcp = { workspace = true, features = ["server", "transport-io", "transport-streamable-http-server"] }
tokio = { workspace = true, features = ["rt-multi-thread", "signal", "net", "time", "sync", "fs"] }
axum = { workspace = true, features = ["http1", "json", "tokio"] }
tokio-util = { workspace = true, features = ["rt"] }
tower = { workspace = true, features = ["util"] }
rustix = { workspace = true, features = ["fs"] }

[dev-dependencies]
tempfile.workspace = true
tungstenite = { workspace = true, features = ["handshake"] }

[lints]
workspace = true
