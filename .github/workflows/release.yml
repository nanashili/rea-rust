name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: 1.93.1

jobs:
  validate:
    name: Validate release inputs
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: python3 scripts/release/package.py --validate-tag "$GITHUB_REF_NAME"

      - name: Accept non-release ref
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: echo "No release tag to validate for $GITHUB_REF"

  installer:
    name: Test installer
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Check installer syntax
        shell: bash
        run: sh -n install.sh

      - name: Run installer black-box tests
        run: python3 scripts/release/test-install.py

  build:
    name: Build (${{ matrix.target }})
    needs:
      - validate
      - installer
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Set up Linux C++20 compiler
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends g++-12
          echo "CC=gcc-12" >> "$GITHUB_ENV"
          echo "CXX=g++-12" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          rustup target add "${{ matrix.target }}"

      - name: Build REA
        shell: bash
        run: |
          cargo build --locked --release --target "${{ matrix.target }}" -p rea

      - name: Build Ghidra worker
        shell: bash
        run: |
          cargo build \
            --locked \
            --release \
            --manifest-path ghidra-rust-worker/Cargo.toml \
            --target "${{ matrix.target }}"

      - name: Package archive
        shell: bash
        run: |
          python3 scripts/release/package.py \
            --target "${{ matrix.target }}" \
            --output-dir dist

      - name: Smoke test archive
        shell: bash
        run: |
          python3 scripts/release/smoke.py \
            --archive "dist/rea-rust-${{ matrix.target }}.tar.gz"

      - name: Upload platform archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.target }}
          path: dist/rea-rust-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 14

  collect:
    name: Collect release assets
    if: >-
      ${{
        needs.build.result == 'success' &&
        (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v'))
      }}
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download platform archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          cd dist
          sha256sum rea-rust-*.tar.gz | sort -k2 > SHA256SUMS

      - name: Stage release bundle
        shell: bash
        run: |
          mkdir -p bundle
          cp dist/rea-rust-*.tar.gz dist/SHA256SUMS install.sh bundle/

      - name: Upload release bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-bundle
          path: bundle
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub release
    if: >-
      ${{
        needs.collect.result == 'success' &&
        startsWith(github.ref, 'refs/tags/v')
      }}
    needs: collect
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download release bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-bundle
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          release_flags=()
          version="${GITHUB_REF_NAME#v}"
          case "${version%%+*}" in
            *-*) release_flags+=(--prerelease) ;;
          esac

          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            "${release_flags[@]}" \
            --notes "Native REA for macOS 13+ and Linux (glibc 2.35+), on ARM64 and x86-64. Each archive includes the CLI, stdio MCP server, Ghidra worker, and investigation skill. See [installation and MCP setup](https://github.com/nanashili/rea-rust/blob/$GITHUB_REF_NAME/docs/installation.md). Download install.sh to install or update without Node.js, Cargo, or sudo; archives are verified against SHA256SUMS." \
            dist/rea-rust-*.tar.gz \
            dist/SHA256SUMS \
            install.sh
