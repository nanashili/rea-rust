name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: 1.93.1

jobs:
  validate:
    name: Validate release inputs
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Test worker cache invalidation
        run: python3 scripts/release/test-build-inputs.py

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: python3 scripts/release/package.py --validate-tag "$GITHUB_REF_NAME"

      - name: Accept non-release ref
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: echo "No release tag to validate for $GITHUB_REF"

  installer:
    name: Test installer
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Check installer syntax
        shell: bash
        run: sh -n install.sh

      - name: Run installer black-box tests
        run: python3 scripts/release/test-install.py

  windows-installer:
    name: Test Windows installer (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Run Windows installer black-box tests
        shell: pwsh
        run: python scripts/release/test-install-windows.py --target "${{ matrix.target }}"

  build:
    name: Build (${{ matrix.target }})
    needs:
      - validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
            archive: rea-rust-aarch64-apple-darwin.tar.gz
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            archive: rea-rust-x86_64-apple-darwin.tar.gz
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
            artifact_target: aarch64-linux-gnu
            archive: rea-rust-aarch64-linux-gnu.tar.gz
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            artifact_target: x86_64-linux-gnu
            archive: rea-rust-x86_64-linux-gnu.tar.gz
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
            archive: rea-rust-x86_64-pc-windows-msvc.zip
            msvc_arch: amd64
            msvc_component: Microsoft.VisualStudio.Component.VC.Tools.x86.x64
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
            archive: rea-rust-aarch64-pc-windows-msvc.zip
            msvc_arch: arm64
            msvc_component: Microsoft.VisualStudio.Component.VC.Tools.ARM64
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"
      # Tags and manually requested release bundles retain shipping optimization.
      BUILD_PROFILE: ${{ (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && 'release' || 'ci' }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Set up Linux C++20 compiler
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends g++-12
          echo "CC=gcc-12" >> "$GITHUB_ENV"
          echo "CXX=g++-12" >> "$GITHUB_ENV"

      - name: Set up Windows MSVC environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires "${{ matrix.msvc_component }}" -property installationPath
          if (-not $vsPath) {
            throw "Visual Studio with the ${{ matrix.msvc_arch }} MSVC toolchain was not found"
          }
          "REA_VS_PATH=$vsPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $devCmd = Join-Path $vsPath "Common7\Tools\VsDevCmd.bat"
          $vsEnvironment = cmd.exe /d /s /c "`"$devCmd`" -arch=${{ matrix.msvc_arch }} -host_arch=${{ matrix.msvc_arch }} >nul && set"
          if ($LASTEXITCODE -ne 0) {
            throw "VsDevCmd.bat could not initialize the ${{ matrix.msvc_arch }} MSVC environment"
          }

          $pathValue = $null
          $allowedVariables = '^(?i:INCLUDE|LIB|LIBPATH|VCINSTALLDIR|VCToolsInstallDir|VCToolsRedistDir|WindowsSdkDir|WindowsSDKVersion|UniversalCRTSdkDir|UCRTVersion|VSINSTALLDIR|VisualStudioVersion|VSCMD_VER)$'
          foreach ($line in $vsEnvironment) {
            if ($line -notmatch '^([^=]+)=(.*)$') {
              continue
            }
            $name = $matches[1]
            $value = $matches[2]
            if ($name -match '^(?i:PATH)$') {
              $pathValue = $value
              continue
            }
            if ($name -match '^(?i:GITHUB_|RUNNER_|CI$|PATHEXT$)' -or $name -notmatch $allowedVariables) {
              continue
            }
            "$name=$value" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
          if (-not $pathValue) {
            throw "VsDevCmd.bat did not provide a PATH"
          }
          "PATH=$pathValue" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          rustup target add "${{ matrix.target }}"

      - name: Identify native build environment
        id: build-environment
        shell: bash
        run: python scripts/release/build_inputs.py

      - name: Restore Cargo build cache
        uses: actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/${{ env.BUILD_PROFILE }}
            target/${{ matrix.target }}/${{ env.BUILD_PROFILE }}
            ghidra-rust-worker/target/${{ env.BUILD_PROFILE }}
            ghidra-rust-worker/target/${{ matrix.target }}/${{ env.BUILD_PROFILE }}
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-rust-${{ env.RUST_TOOLCHAIN }}-profile-${{ env.BUILD_PROFILE }}-crt-${{ runner.os == 'Windows' && 'static' || 'default' }}-${{ hashFiles('Cargo.lock', 'ghidra-rust-worker/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-rust-${{ env.RUST_TOOLCHAIN }}-profile-${{ env.BUILD_PROFILE }}-crt-${{ runner.os == 'Windows' && 'static' || 'default' }}-${{ hashFiles('Cargo.lock', 'ghidra-rust-worker/Cargo.lock') }}-

      # Reuse the independently built worker only for exactly matching inputs.
      # Runner image identity covers the native compiler and SDK environment.
      - name: Restore unchanged Ghidra worker
        id: worker-cache
        uses: actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: ghidra-rust-worker/target/${{ matrix.target }}/${{ env.BUILD_PROFILE }}/rea-ghidra-rust-worker${{ runner.os == 'Windows' && '.exe' || '' }}
          key: worker-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.build-environment.outputs.image }}-${{ matrix.target }}-rust-${{ env.RUST_TOOLCHAIN }}-${{ env.BUILD_PROFILE }}-${{ steps.build-environment.outputs.worker-inputs }}

      - name: Build REA
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cargo build --locked --profile "${{ env.BUILD_PROFILE }}" --target "${{ matrix.target }}" -p rea

      - name: Build Ghidra worker
        if: runner.os != 'Windows' && steps.worker-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          cargo build \
            --locked \
            --profile "${{ env.BUILD_PROFILE }}" \
            --manifest-path ghidra-rust-worker/Cargo.toml \
            --target "${{ matrix.target }}"

      - name: Build Windows binaries
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $devCmd = Join-Path $env:REA_VS_PATH "Common7\Tools\VsDevCmd.bat"
          $env:RUSTFLAGS = '-C target-feature=+crt-static'
          $command = "call `"$devCmd`" -arch=${{ matrix.msvc_arch }} -host_arch=${{ matrix.msvc_arch }} && cargo build --locked --profile ${{ env.BUILD_PROFILE }} --target ${{ matrix.target }} -p rea"
          cmd.exe /d /s /c $command
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Windows Ghidra worker
        if: runner.os == 'Windows' && steps.worker-cache.outputs.cache-hit != 'true'
        shell: pwsh
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"
        run: |
          cargo build --locked --profile "${{ env.BUILD_PROFILE }}" --manifest-path ghidra-rust-worker/Cargo.toml --target "${{ matrix.target }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test Windows launcher module path
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"
        run: cargo test --locked --profile "${{ env.BUILD_PROFILE }}" --target "${{ matrix.target }}" -p rea-host process::launcher

      - name: Test Windows Evidence publication
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"
        run: cargo test --locked --profile "${{ env.BUILD_PROFILE }}" --target "${{ matrix.target }}" -p rea-host fs::staged_output

      - name: Verify Windows runtime dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dumpbin = (Get-Command dumpbin.exe -ErrorAction Stop).Source
          $binaries = @(
            "target\${{ matrix.target }}\${{ env.BUILD_PROFILE }}\rea.exe",
            "ghidra-rust-worker\target\${{ matrix.target }}\${{ env.BUILD_PROFILE }}\rea-ghidra-rust-worker.exe"
          )
          foreach ($binary in $binaries) {
            if (-not (Test-Path $binary)) {
              throw "missing Windows binary: $binary"
            }
            $dependencies = & $dumpbin /dependents $binary 2>&1
            if ($LASTEXITCODE -ne 0) {
              throw "dumpbin failed for $binary"
            }
            if ($dependencies -match '(?i)\b(?:MSVCP|VCRUNTIME)\d+(?:_\d+)?\.dll\b') {
              throw "$binary depends on the dynamic MSVC runtime: $($Matches[0])"
            }
          }

      - name: Package archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          python3 scripts/release/package.py \
            --target "${{ matrix.target }}" \
            --output-dir dist --profile "${{ env.BUILD_PROFILE }}"

      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: python scripts/release/package.py --target "${{ matrix.target }}" --output-dir dist --profile "${{ env.BUILD_PROFILE }}"

      - name: Smoke test archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          python3 scripts/release/smoke.py \
            --archive "dist/${{ matrix.archive }}"

      - name: Smoke test Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: python scripts/release/smoke.py --archive "dist/${{ matrix.archive }}"

      - name: Upload platform archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.artifact_target || matrix.target }}
          path: dist/${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 14

  checks:
    name: All platform checks
    if: always()
    needs: [validate, installer, windows-installer, build]
    runs-on: ubuntu-22.04
    steps:
      - name: Require every check to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          results = json.loads(os.environ["RESULTS"])
          failed = [name for name, job in results.items() if job["result"] != "success"]
          if failed:
              raise SystemExit(f"Required checks did not succeed: {', '.join(failed)}")
          PYTHON

  collect:
    name: Collect release assets
    if: >-
      ${{
        needs.build.result == 'success' &&
        needs.installer.result == 'success' &&
        needs.windows-installer.result == 'success' &&
        (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v'))
      }}
    needs: [build, installer, windows-installer]
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download platform archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          cd dist
          sha256sum rea-rust-* | sort -k2 > SHA256SUMS

      - name: Stage release bundle
        shell: bash
        run: |
          mkdir -p bundle
          cp dist/rea-rust-* dist/SHA256SUMS install.sh install.ps1 bundle/

      - name: Upload release bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-bundle
          path: bundle
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub release
    if: >-
      ${{
        needs.collect.result == 'success' &&
        startsWith(github.ref, 'refs/tags/v')
      }}
    needs: collect
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download release bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-bundle
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          release_flags=()
          version="${GITHUB_REF_NAME#v}"
          case "${version%%+*}" in
            *-*) release_flags+=(--prerelease) ;;
          esac

          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            "${release_flags[@]}" \
            --notes "Native REA for macOS 13+ and Linux (glibc 2.35+) on ARM64 and x86-64, plus Windows on x86-64 and ARM64. Each archive includes the CLI, stdio MCP server, Ghidra worker, and investigation skill. See [installation and MCP setup](https://github.com/nanashili/rea-rust/blob/$GITHUB_REF_NAME/docs/installation.md). Download install.sh or install.ps1 to install without Node.js, Cargo, or sudo; archives are verified against SHA256SUMS." \
            dist/rea-rust-* \
            dist/SHA256SUMS \
            install.sh \
            install.ps1
